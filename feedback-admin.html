<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#087f5b"><title>Feedback-Verwaltung · TarifKlar</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f6;color:#17231c;font:15px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.wrap{max-width:850px;margin:auto;padding:28px 18px 80px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}a{color:#087f5b}.card{background:white;border:1px solid #e0e9e2;border-radius:16px;padding:20px;margin:14px 0}.field{width:100%;padding:13px;border:1px solid #cdd9d0;border-radius:9px;font:inherit}.btn{padding:11px 15px;border:0;border-radius:9px;background:#087f5b;color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#e9f1eb;color:#234532}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.post{border-top:1px solid #e8eee9;padding:17px 0}.post:first-child{border:0}.muted{color:#64736a;font-size:13px}.status{padding:6px;border:1px solid #cdd9d0;border-radius:8px}.error{color:#a52d2d}.hidden{display:none!important}h1{font-size:30px;letter-spacing:-1px}h2{font-size:18px;margin:0 0 12px}p{overflow-wrap:anywhere}</style></head><body><main class="wrap"><header><strong>TarifKlar · Verwaltung</strong><a href="feedback.html">Öffentliches Board ↗</a></header><h1>Community moderieren</h1><p class="muted">Nur für die interne Verwaltung. Beiträge bleiben unsichtbar, bis sie freigegeben werden.</p><section class="card" id="login"><h2>Geschützter Zugang</h2><label for="token">Verwaltungs-Passwort</label><input class="field" id="token" type="password" autocomplete="current-password" placeholder="Passwort eingeben"><div class="actions"><button class="btn" id="loginBtn">Anmelden</button></div><p id="loginMsg" class="error" role="status"></p></section><section class="card hidden" id="dashboard"><div class="actions" style="justify-content:space-between"><h2>Beiträge</h2><button class="btn secondary" id="refresh">Aktualisieren</button></div><div id="posts" aria-live="polite" class="muted">Lade Beiträge …</div></section></main><script>
const API="https://tarifklar-feedback-api.kibruder.workers.dev/api/feedback";let adminToken="";
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cats={idea:"Idee",wish:"Wunsch",criticism:"Kritik",bug:"Fehler",praise:"Lob"},statuses={new:"Neu – nicht veröffentlicht",planned:"Geplant",in_progress:"In Arbeit",done:"Umgesetzt",declined:"Nicht geplant"};
async function load(){const box=$("posts");box.textContent="Lade …";try{const r=await fetch(API+"?admin=1",{headers:{Authorization:"Bearer "+adminToken}});const d=await r.json();if(!r.ok)throw Error(d.error||"Zugriff verweigert");if(!d.posts.length){box.textContent="Noch keine Beiträge eingegangen.";return;}box.innerHTML=d.posts.map(p=>'<article class="post" data-id="'+Number(p.id)+'"><div class="muted">#'+Number(p.id)+' · '+esc(cats[p.category]||p.category)+' · '+esc(p.created_at)+' · '+Number(p.votes)+' Stimmen · '+(p.is_public?"öffentlich":"nicht veröffentlicht")+'</div><h3>'+esc(p.title)+'</h3><p>'+esc(p.body)+'</p><label>Status <select class="status">'+Object.entries(statuses).map(([v,l])=>'<option value="'+v+'" '+(p.status===v?"selected":"")+'>'+l+'</option>').join("")+'</select></label><div class="actions"><button class="btn" data-save>Speichern & veröffentlichen</button><button class="btn secondary" data-hide>Nur Status speichern / nicht veröffentlichen</button></div></article>').join("");}catch(e){box.textContent=e.message;}}
$("loginBtn").addEventListener("click",async()=>{adminToken=$("token").value.trim();$("loginMsg").textContent="Prüfe Zugang …";try{const r=await fetch(API+"?admin=1",{headers:{Authorization:"Bearer "+adminToken}});const d=await r.json();if(!r.ok)throw Error(d.error||"Zugang nicht möglich");$("login").classList.add("hidden");$("dashboard").classList.remove("hidden");await load();}catch(e){adminToken="";$("loginMsg").textContent=e.message;}});
$("refresh").addEventListener("click",load);
$("posts").addEventListener("click",async e=>{const card=e.target.closest("[data-id]");if(!card)return;const status=card.querySelector("select").value;const publish=e.target.hasAttribute("data-save");if(!publish&&!e.target.hasAttribute("data-hide"))return;const buttons=card.querySelectorAll("button");buttons.forEach(b=>b.disabled=true);try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+adminToken},body:JSON.stringify({action:"moderate",id:Number(card.dataset.id),status,publish})});const d=await r.json();if(!r.ok)throw Error(d.error||"Änderung fehlgeschlagen");await load();}catch(err){alert(err.message);buttons.forEach(b=>b.disabled=false);}});
</script></body></html>
